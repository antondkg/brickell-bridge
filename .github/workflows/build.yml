name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build app
        run: ./build.sh
      - name: Zip app
        run: ditto -c -k --keepParent BrickellBridge.app BrickellBridge.zip
      - uses: actions/upload-artifact@v4
        with:
          name: BrickellBridge
          path: BrickellBridge.zip
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: BrickellBridge.zip
          generate_release_notes: true
