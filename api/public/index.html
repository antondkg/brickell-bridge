<style>
  /* One viewport: the real Brickell in 3D fills it, the answer sits on top. Mint = open to traffic, coral = raised. */
  :root {
    --ink: #f4f6fb;
    --ink-2: rgba(244, 246, 251, 0.74);
    --ink-3: rgba(244, 246, 251, 0.52);
    --glass: rgba(12, 18, 34, 0.46);
    --glass-line: rgba(255, 255, 255, 0.14);
    --down: #7cf0b4;
    --up: #ff5d62;
    --wait: #c9d3ea;
    --display: "Anton", "Impact", "Arial Narrow", sans-serif;
    --body: "Archivo", -apple-system, "Helvetica Neue", Arial, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
    --pad: max(16px, env(safe-area-inset-left));
    color-scheme: dark;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; overflow: hidden; background: #0a1020; color: var(--ink); font-family: var(--body); -webkit-font-smoothing: antialiased; touch-action: none; }
  canvas#scene { position: fixed; inset: 0; width: 100vw; height: 100dvh; display: block; outline: none; }

  .ui { position: fixed; inset: 0; pointer-events: none; display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: auto 1fr auto auto; padding: max(14px, env(safe-area-inset-top)) var(--pad) max(14px, env(safe-area-inset-bottom)); }
  .ui > * { pointer-events: none; }
  .ui a, .ui button, .ui input { pointer-events: auto; }
  .shade { position: fixed; inset: auto 0 0 0; height: 60dvh; pointer-events: none;
    background: linear-gradient(to top, rgba(6, 10, 22, .88), rgba(6, 10, 22, .5) 40%, rgba(6, 10, 22, 0)); }
  .shade-top { position: fixed; inset: 0 0 auto 0; height: 110px; pointer-events: none; background: linear-gradient(to bottom, rgba(6,10,22,.5), rgba(6,10,22,0)); }

  .top { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .brand { display: flex; align-items: center; gap: 10px; font: 500 12px var(--mono); color: var(--ink-2); }
  .live { display: inline-flex; align-items: center; gap: 6px; padding: 4px 9px; border-radius: 99px; background: var(--glass); border: 1px solid var(--glass-line); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); color: var(--ink); font-weight: 600; font-size: 11px; letter-spacing: .12em; }
  .live i { width: 7px; height: 7px; border-radius: 50%; background: var(--wait); }
  .live.on i { background: var(--down); animation: ping 2s infinite; }
  @keyframes ping { 0% { box-shadow: 0 0 0 0 rgba(124,240,180,.6); } 100% { box-shadow: 0 0 0 9px rgba(124,240,180,0); } }
  .actions { display: flex; gap: 8px; }
  .pill { display: inline-flex; align-items: center; gap: 7px; height: 34px; padding: 0 13px; border-radius: 99px; border: 1px solid var(--glass-line); background: var(--glass); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); color: var(--ink); font: 600 12.5px var(--body); text-decoration: none; cursor: pointer; white-space: nowrap; transition: background .2s, border-color .2s, transform .15s, opacity .2s; }
  .pill:hover { background: rgba(30, 40, 70, .62); border-color: rgba(255,255,255,.28); }
  .pill:active { transform: scale(.97); }
  .pill[aria-pressed="true"] { background: rgba(124, 240, 180, .18); border-color: rgba(124, 240, 180, .5); }
  .pill:disabled { opacity: .45; cursor: default; }
  .pill:focus-visible, input:focus-visible, .clock button:focus-visible { outline: 2px solid var(--down); outline-offset: 2px; }
  .pill svg { width: 15px; height: 15px; flex: none; }
  .hide-sm { display: inline; }

  .answer { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; padding-bottom: 12px; max-width: 760px; }
  .q { font: 600 clamp(12px, 1.5vw, 15px) var(--body); letter-spacing: .14em; text-transform: uppercase; color: var(--ink-2); }
  .a { font: 400 clamp(96px, 20vw, 250px)/.9 var(--display); color: var(--wait); text-shadow: 0 6px 40px rgba(0,0,0,.35); transition: color .6s; display: flex; align-items: baseline; gap: .14em; margin-top: 4px; }
  .a small { font: 600 clamp(15px, 2vw, 24px) var(--body); color: var(--ink-2); }
  .a.down { color: var(--down); }
  .a.up { color: var(--up); }
  .sub { font: 500 clamp(15px, 1.7vw, 19px) var(--body); color: var(--ink); max-width: 40ch; text-wrap: balance; }
  .forecast { display: flex; align-items: flex-start; gap: 10px; margin-top: 10px; padding: 9px 12px; border-radius: 12px; background: var(--glass); border: 1px solid var(--glass-line); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); font: 500 13px var(--body); color: var(--ink-2); max-width: 46ch; }
  .forecast b { color: var(--ink); font-weight: 650; }
  .forecast .tag { flex: none; font: 600 10px var(--mono); letter-spacing: .1em; text-transform: uppercase; padding: 3px 6px; border-radius: 6px; background: rgba(255,255,255,.1); color: var(--ink); margin-top: 1px; }
  .forecast[hidden] { display: none; }
  .facts { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-top: 10px; font: 500 12.5px var(--mono); color: var(--ink-2); }
  .facts b { color: var(--ink); font-weight: 600; }
  .demo-chip { display: none; margin-top: 10px; padding: 5px 10px; border-radius: 8px; background: rgba(255, 93, 98, .16); border: 1px solid rgba(255, 93, 98, .4); color: #ffd3d4; font: 600 12px var(--body); }
  .demo-chip.on { display: inline-block; }

  .bottom { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
  .controls { display: flex; gap: 8px; flex-wrap: wrap; }
  .clock { display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 6px 0 14px; border-radius: 99px; border: 1px solid var(--glass-line); background: var(--glass); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
  .clock label { font: 600 12px var(--mono); color: var(--ink); min-width: 9.5ch; }
  .clock input { -webkit-appearance: none; appearance: none; width: clamp(110px, 20vw, 210px); height: 4px; border-radius: 4px; background: linear-gradient(90deg, #0b1430, #ff9a5c 26%, #8fd0ff 50%, #ff8a4c 76%, #0b1430); cursor: pointer; }
  .clock input::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px; border-radius: 50%; background: #fff; box-shadow: 0 1px 6px rgba(0,0,0,.4); }
  .clock input::-moz-range-thumb { width: 18px; height: 18px; border: 0; border-radius: 50%; background: #fff; }
  .clock button { height: 28px; padding: 0 10px; border-radius: 99px; border: 0; background: rgba(255,255,255,.1); color: var(--ink); font: 600 11px var(--body); letter-spacing: .06em; cursor: pointer; }
  .clock button[aria-pressed="true"] { background: var(--down); color: #062014; }
  .demo { background: rgba(255, 93, 98, .2); border-color: rgba(255, 93, 98, .45); height: 40px; }
  .demo:hover { background: rgba(255, 93, 98, .32); }
  .foot { width: 100%; display: flex; justify-content: space-between; gap: 12px; margin-top: 10px; font: 500 11px var(--body); color: var(--ink-3); }
  .foot a { color: var(--ink-2); }
  .hint { transition: opacity 1s; }

  .loading { position: fixed; inset: 0; display: grid; place-items: center; background: #0a1020; z-index: 5; transition: opacity .9s; }
  .loading.gone { opacity: 0; pointer-events: none; }
  .loading div { display: flex; flex-direction: column; align-items: center; gap: 14px; font: 600 12px var(--mono); letter-spacing: .14em; color: var(--ink-2); text-transform: uppercase; }
  .loading i { width: 160px; height: 3px; border-radius: 3px; background: rgba(255,255,255,.12); overflow: hidden; }
  .loading i::after { content: ""; display: block; height: 100%; width: var(--p, 10%); background: var(--down); transition: width .3s; }
  .toast { position: fixed; left: 50%; top: max(64px, calc(env(safe-area-inset-top) + 56px)); transform: translateX(-50%); padding: 8px 14px; border-radius: 10px; background: var(--glass); border: 1px solid var(--glass-line); backdrop-filter: blur(10px); font: 500 12.5px var(--body); color: var(--ink); opacity: 0; transition: opacity .3s; pointer-events: none; }
  .toast.on { opacity: 1; }

  @media (max-width: 640px) {
    .hide-sm { display: none; }
    .answer { padding-bottom: 6px; }
    .forecast { font-size: 12.5px; }
    .bottom { gap: 8px; }
    .controls { width: 100%; }
    .clock { flex: 1 1 260px; min-width: 0; }
    .demo { flex: 1 1 auto; justify-content: center; }
    .clock input { flex: 1; width: auto; min-width: 60px; }
    .foot { flex-direction: column; gap: 2px; }
  }
  @media (max-height: 600px) and (orientation: landscape) {
    .a { font-size: clamp(72px, 17vh, 150px); }
    .facts, .foot .hint, .forecast { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { .live.on i { animation: none; } }
</style>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { EffectComposer } from "three/addons/postprocessing/EffectComposer.js";
import { RenderPass } from "three/addons/postprocessing/RenderPass.js";
import { UnrealBloomPass } from "three/addons/postprocessing/UnrealBloomPass.js";
import { OutputPass } from "three/addons/postprocessing/OutputPass.js";
import { mergeGeometries } from "three/addons/utils/BufferGeometryUtils.js";

// ---------------------------------------------------------------- constants
const API = location.protocol === "file:" ? "https://api.brickellbridge.fun" : "";
const MOBILE = matchMedia("(pointer: coarse)").matches || Math.min(innerWidth, innerHeight) < 600;
const TZ = "America/New_York";
const LAT0 = 25.769925, LON0 = -80.19003;   // center of the bascule span; the scene's origin
const ROAD_Y = 0.12;                         // street level is y = 0
const WATER_Y = -1.4;
const HINGE = 20.5;                          // each leaf is 20.5 m, hinges 41 m apart (OSM)
const DECK_W = 28;
const OPEN_ANGLE = THREE.MathUtils.degToRad(74);

let seed = 253;
const rand = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
const randRange = (a, b) => a + (b - a) * rand();
const clamp01 = (x) => Math.min(1, Math.max(0, x));
const ease = (t) => t * t * (3 - 2 * t);
const $ = (id) => document.getElementById(id);
const setLoad = (p, text) => { $("loadBar").style.setProperty("--p", `${Math.round(p * 100)}%`); if (text) $("loadText").textContent = text; };
const toast = (msg) => { const t = $("toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("on"), 3500); };

// ---------------------------------------------------------------- renderer, scene, camera
const canvas = $("scene");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: !MOBILE, powerPreference: "high-performance" });
renderer.setPixelRatio(Math.min(devicePixelRatio, MOBILE ? 1.75 : 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.shadowMap.enabled = !MOBILE;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x9ec4e8, 900, 3600);
const camera = new THREE.PerspectiveCamera(MOBILE ? 52 : 40, 1, 1, 12000);

const controls = new OrbitControls(camera, canvas);
controls.target.set(0, 18, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.enablePan = false;
controls.minDistance = 60;
controls.maxDistance = 1400;
controls.maxPolarAngle = 1.48;
controls.minPolarAngle = 0.2;

// From over Biscayne Bay looking up the river: Icon Brickell on the left, downtown on the right, the bridge between.
const VIEW_THETA = 1.62;
const VIEW_PHI = 0.92;
const sph = new THREE.Spherical(640, VIEW_PHI, VIEW_THETA);
camera.position.setFromSpherical(sph).add(controls.target);
let idle = true, idleTimer, baseRadius = 640;
controls.addEventListener("start", () => { idle = false; clearTimeout(idleTimer); $("hint").style.opacity = 0; });
controls.addEventListener("end", () => { idleTimer = setTimeout(() => (idle = true), 9000); });
const _off = new THREE.Vector3();
function driftCamera(dt, t) {
  if (!idle) return;
  _off.copy(camera.position).sub(controls.target);
  sph.setFromVector3(_off);
  const goal = VIEW_THETA + Math.sin(t * 0.045) * 0.3;
  const d = Math.atan2(Math.sin(goal - sph.theta), Math.cos(goal - sph.theta));
  const k = Math.min(1, dt * 0.3);
  sph.theta += d * k;
  sph.phi += (VIEW_PHI - sph.phi) * k;
  sph.radius += (baseRadius - sph.radius) * k;
  camera.position.copy(controls.target).add(_off.setFromSpherical(sph));
}

// ---------------------------------------------------------------- sky & stars
const skyU = {
  uTop: { value: new THREE.Color() }, uHorizon: { value: new THREE.Color() },
  uSunDir: { value: new THREE.Vector3() }, uSunColor: { value: new THREE.Color() }, uSunVis: { value: 1 },
  uMoonDir: { value: new THREE.Vector3() }, uNight: { value: 0 },
};
const sky = new THREE.Mesh(new THREE.SphereGeometry(9000, 32, 16), new THREE.ShaderMaterial({
  uniforms: skyU, side: THREE.BackSide, depthWrite: false, fog: false,
  vertexShader: `varying vec3 vDir; void main(){ vDir = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.); }`,
  fragmentShader: `
    uniform vec3 uTop, uHorizon, uSunDir, uSunColor, uMoonDir; uniform float uSunVis, uNight; varying vec3 vDir;
    void main(){
      vec3 d = normalize(vDir);
      vec3 col = mix(uHorizon, uTop, pow(clamp(d.y * 1.5, 0., 1.), .6));
      float s = max(dot(d, normalize(uSunDir)), 0.);
      col += uSunColor * (pow(s, 900.) * 6. + pow(s, 12.) * .35 + pow(s, 3.) * .08) * uSunVis;
      float m = max(dot(d, normalize(uMoonDir)), 0.);
      col += vec3(.9,.93,1.) * (smoothstep(.9994, .9997, m) * 1.6 + pow(m, 60.) * .12) * uNight;
      if (d.y < 0.) col = uHorizon;
      gl_FragColor = vec4(col, 1.);
      #include <tonemapping_fragment>
      #include <colorspace_fragment>
    }`,
}));
sky.renderOrder = -10;
scene.add(sky);
const stars = (() => {
  const n = 1000, pos = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) {
    const th = rand() * Math.PI * 2, v = randRange(0.08, 1), r = 8500;
    pos.set([Math.cos(th) * Math.sqrt(1 - v * v) * r, v * r, Math.sin(th) * Math.sqrt(1 - v * v) * r], i * 3);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.BufferAttribute(pos, 3));
  const p = new THREE.Points(g, new THREE.PointsMaterial({ color: 0xffffff, size: 1.6, sizeAttenuation: false, transparent: true, opacity: 0, depthWrite: false, fog: false }));
  p.renderOrder = -9;
  scene.add(p);
  return p;
})();

// ---------------------------------------------------------------- lights
const hemi = new THREE.HemisphereLight(0xbfdcff, 0x2a2f3a, 0.9);
const sun = new THREE.DirectionalLight(0xffffff, 2.2);
sun.castShadow = !MOBILE;
sun.shadow.mapSize.set(4096, 4096);
Object.assign(sun.shadow.camera, { left: -650, right: 650, top: 650, bottom: -650, near: 50, far: 3000 });
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.6;
scene.add(hemi, sun, sun.target);

// ---------------------------------------------------------------- water
const waveJS = (x, z, t) => Math.sin(x * 0.06 + t * 0.9) * 0.22 + Math.sin(z * 0.09 - t * 1.1) * 0.16 + Math.sin((x + z) * 0.19 + t * 1.7) * 0.07;
const waterU = {
  uTime: { value: 0 }, uCam: { value: camera.position },
  uTop: skyU.uTop, uHorizon: skyU.uHorizon, uSunDir: skyU.uSunDir, uSunColor: skyU.uSunColor, uSunVis: skyU.uSunVis, uNight: skyU.uNight,
  uDeep: { value: new THREE.Color(0x0d3d4c) }, uFog: { value: new THREE.Color() }, uFogNear: { value: 900 }, uFogFar: { value: 3600 },
};
const waterGeo = new THREE.PlaneGeometry(9000, 9000, MOBILE ? 160 : 300, MOBILE ? 160 : 300);
waterGeo.rotateX(-Math.PI / 2);
const water = new THREE.Mesh(waterGeo, new THREE.ShaderMaterial({
  uniforms: waterU,
  vertexShader: `
    uniform float uTime; varying vec3 vW; varying vec3 vN;
    float h(vec2 p){ return sin(p.x*.06+uTime*.9)*.22 + sin(p.y*.09-uTime*1.1)*.16 + sin((p.x+p.y)*.19+uTime*1.7)*.07 + sin((p.x*.6-p.y)*.41-uTime*2.4)*.03; }
    void main(){
      vec4 w = modelMatrix * vec4(position, 1.);
      float e = .8, y = h(w.xz);
      vN = normalize(vec3(y - h(w.xz + vec2(e,0.)), e, y - h(w.xz + vec2(0.,e))));
      w.y += y; vW = w.xyz;
      gl_Position = projectionMatrix * viewMatrix * w;
    }`,
  fragmentShader: `
    uniform vec3 uCam, uTop, uHorizon, uSunDir, uSunColor, uDeep, uFog; uniform float uTime, uSunVis, uNight, uFogNear, uFogFar;
    varying vec3 vW; varying vec3 vN;
    void main(){
      vec3 n = normalize(vN), v = normalize(uCam - vW);
      float fres = pow(1. - max(dot(n, v), 0.), 4.);
      vec3 r = reflect(-v, n);
      vec3 skyc = mix(uHorizon, uTop, clamp(r.y * 1.6, 0., 1.));
      vec3 col = mix(uDeep * (1. - uNight * .75), skyc, .16 + .74 * fres);
      col += uSunColor * pow(max(dot(r, normalize(uSunDir)), 0.), 260.) * 3. * uSunVis;
      // warm city light smeared across the ripples at night
      float glow = pow(max(dot(r, normalize(vec3(-uCam.x, 0., -uCam.z) + vec3(0., .25, 0.))), 0.), 6.);
      col += vec3(1., .72, .42) * (.05 + .25 * glow) * uNight * (.6 + .4 * n.x);
      gl_FragColor = vec4(mix(col, uFog, smoothstep(uFogNear, uFogFar, length(uCam - vW))), 1.);
      #include <tonemapping_fragment>
      #include <colorspace_fragment>
    }`,
}));
water.position.y = WATER_Y;
scene.add(water);

// ---------------------------------------------------------------- materials
const mat = {
  land: new THREE.MeshStandardMaterial({ color: 0xbdb7aa, roughness: 0.95 }),   // patched below to show the aerial photo
  road: new THREE.MeshStandardMaterial({ color: 0x3a3d43, roughness: 0.92 }),

  try {
    const j = await (await fetch(`${API}/v1/status`, { cache: "no-store" })).json();
    const changed = live.loaded && j.state !== live.state;
    Object.assign(live, { state: j.state, since: j.since ? new Date(j.since) : null, loaded: true });
    $("live").classList.add("on");
    if (changed) loadOpenings();
  } catch { $("live").classList.remove("on"); }
  render();
}
async function loadOpenings() {
  try {

    const today = miamiDay(new Date());
    const todays = j.openings.filter((o) => miamiDay(new Date(o.start)) === today);
    live.todayCount = todays.length;
    live.todayMin = todays.reduce((a, o) => a + ((o.end ? new Date(o.end) : new Date()) - new Date(o.start)) / 60000, 0);
    const durs = j.openings.filter((o) => o.end).map((o) => (new Date(o.end) - new Date(o.start)) / 60000).sort((a, b) => a - b);
    live.median = durs.length >= 3 ? durs[Math.floor(durs.length / 2)] : null;
  } catch {}

}

  try { live.forecast = await (await fetch(`${API}/v1/forecast`, { cache: "no-store" })).json(); } catch {}

  else if (live.state === "up") {

    const mins = live.since ? (Date.now() - live.since) / 60000 : 0;
    let s = live.since ? `Up since ${fmtTime(live.since)} · ${fmtDur(mins)}. Closed to traffic.` : "Closed to traffic.";
    if (live.median && live.since) s += mins < live.median ? ` Usually back down around ${fmtTime(new Date(+live.since + live.median * 60000))}.` : " Any minute now.";
    sub.textContent = s;
  } else if (live.state === "down") {
    a.classList.add("down"); a.innerHTML = "NO<small>open to traffic</small>";
    sub.textContent = live.since ? `Down since ${fmtTime(live.since)} · ${fmtDur((Date.now() - live.since) / 60000)}. Go ahead.` : "Open to traffic.";
  } else { a.textContent = "?"; sub.textContent = "FL511 isn't reporting a status right now."; }

  const f = live.forecast;

    const until = f.modeUntil ? fmtTime(new Date(f.modeUntil)) : null;
    const slots = (f.nextSlots || []).map((s) => fmtTime(new Date(s)));
    if (f.mode === "closed-to-boats") {
      $("fcTag").textContent = "No openings";
      $("fcText").innerHTML = `It's the ${f.reason}, so it won't open for boats until <b>${until}</b>. Tugs and emergencies are the exception.`;
    } else if (f.mode === "half-hourly") {
      $("fcTag").textContent = "Schedule";
      $("fcText").innerHTML = `Weekdays it only opens on the hour and half hour. Next possible openings <b>${slots[0]}</b>, then ${slots[1]}.`;
    } else {
      $("fcTag").textContent = "On signal";
      $("fcText").innerHTML = `No schedule limits right now (${f.reason}). It can open any time a boat signals${until ? `, until ${until}` : ""}.`;
    }
  }
  $("facts").innerHTML = live.loaded
    ? `<span>Today <b>${live.todayCount}</b> openings</span><span><b>${fmtDur(live.todayMin)}</b> up</span>` + (live.median ? `<span>Typical opening <b>${fmtDur(live.median)}</b></span>` : "")
    : "";
  const demo = Date.now() < demoUntil;
  $("demoChip").classList.toggle("on", demo);
  $("demoChip").textContent = demo ? `Demo animation · the real bridge is ${live.state === "up" ? "up" : "down"}` : "";
}

// ---------------------------------------------------------------- controls
// ?t=19.5 pins the time of day (Miami hours), handy for sharing a sunset view
const tParam = parseFloat(new URLSearchParams(location.search).get("t"));
let timeOverride = Number.isFinite(tParam) ? ((tParam % 24) + 24) % 24 : null;
const timeInput = $("time"), liveBtn = $("liveTime");
if (timeOverride !== null) liveBtn.setAttribute("aria-pressed", "false");
function miamiHourNow() {
  const p = new Intl.DateTimeFormat("en-US", { timeZone: TZ, hour: "numeric", minute: "numeric", hourCycle: "h23" }).formatToParts(new Date());
  return +p.find((x) => x.type === "hour").value + +p.find((x) => x.type === "minute").value / 60;
}
const hourLabel = (h) => { const hh = Math.floor(h) % 24, mm = Math.floor((h % 1) * 60); return `Miami ${(hh % 12) || 12}:${String(mm).padStart(2, "0")} ${hh < 12 ? "AM" : "PM"}`; };
timeInput.addEventListener("input", () => { timeOverride = timeInput.value / 60; liveBtn.setAttribute("aria-pressed", "false"); });
liveBtn.addEventListener("click", () => { timeOverride = null; liveBtn.setAttribute("aria-pressed", "true"); });
$("demo").addEventListener("click", () => { demoUntil = Date.now() + 60000; nextTall = 0; render(); setTimeout(render, 60100); });
$("photo").addEventListener("click", () => enablePhoto(!photoOn));
$("sound").addEventListener("click", () => {
  const on = sound.toggle();
  $("sound").setAttribute("aria-pressed", on);
  $("wave").setAttribute("opacity", on ? "1" : ".35");
  if (on) sound.bell();
});

// ---------------------------------------------------------------- bridge state machine
let gate = 0, leaf = 0, lastBell = 0, nextSpeed = 3, nextTall = 0, shownHour = -1;
const wantUp = () => Date.now() < demoUntil || live.state === "up";
function stepBridge(dt, t) {
  const up = wantUp();
  if (up) { gate = Math.min(1, gate + dt / 2.2); if (gate >= 1 && bridgeClear()) leaf = Math.min(1, leaf + dt / 7); }
  else { leaf = Math.max(0, leaf - dt / 7); if (leaf <= 0) gate = Math.max(0, gate - dt / 2.2); }
  if (((up && leaf < 1) || (!up && gate > 0)) && t - lastBell > 0.55) { sound.bell(); lastBell = t; }
  for (const h of leaves) h.rotation.x = -OPEN_ANGLE * ease(leaf);
  const g = ease(gate);
  for (const gt of gates) gt.pivot.rotation.z = -gt.dir * (1 - g) * (Math.PI / 2);
  mat.redLamp.emissiveIntensity = gate > 0.01 ? (Math.sin(t * 7) > 0 ? 4 : 0.1) : 0;
  for (const s of signalLamps) s.lamp.material.emissiveIntensity = gate > 0.01 ? ((Math.sin(t * 6) > 0) === !!s.phase ? 5 : 0.1) : 0;
  return ease(leaf);
}

// ---------------------------------------------------------------- start
const clock = new THREE.Clock();
let elapsed = 0;
function frame() {
  const dt = Math.min(clock.getDelta(), 0.05);
  elapsed += dt;
  const t = elapsed;
  const hour = timeOverride ?? miamiHourNow();
  if (Math.abs(hour - shownHour) > 1 / 120) {
    applyTime(hour);
    shownHour = hour;
    $("timeLabel").textContent = hourLabel(hour);
    if (timeOverride === null) timeInput.value = Math.round(hour * 60);
  }
  const open = stepBridge(dt, t);
  if (road) updateCars(dt, gate > 0.02);
  if (riv) {
    if (t > nextSpeed) { if (boats.filter((b) => !b.tall).length < 3) spawnBoat("speed"); nextSpeed = t + randRange(8, 18); }
    if (open > 0.5 && t > nextTall && boats.filter((b) => b.tall).length < 2) { spawnBoat(rand() < 0.65 ? "sail" : "tug"); nextTall = t + randRange(20, 35); }
    updateBoats(dt, t, open);
  }
  updateWake(dt);
  for (const b of beacons) b.m.emissiveIntensity = Math.sin(t * 2.2 + b.phase) > 0.6 ? 3 : 0.15;
  waterU.uTime.value = t;
  sky.position.copy(camera.position);
  stars.position.copy(camera.position);
  driftCamera(dt, t);
  controls.update();
  if (tiles && photoOn) { camera.updateMatrixWorld(); tiles.update(); }
  composer.render();
  requestAnimationFrame(frame);
}

(async () => {
  loadStatus(); loadOpenings(); loadForecast(); setupGoogle();
  setInterval(loadStatus, 15000);
  setInterval(loadOpenings, 60000);
  setInterval(loadForecast, 60000);
  setInterval(render, 30000);
  const t0 = performance.now();
  try {
    const city = await buildCity();
    console.log(`city built in ${Math.round(performance.now() - t0)} ms`);
    road = polyline(city.route);
    initCars();
    const r = city.river, lx = r[r.length - 2], lz = r[r.length - 1];
    riv = polyline(r, [[lx + 160, lz + 30], [lx + 500, lz + 140], [lx + 1100, lz + 260]]);   // carry on into Biscayne Bay
    plantPalms();
    await loadOrtho().then(() => { roadMeshRef.visible = false; }).catch((err) => console.warn("aerial imagery unavailable", err));
  } catch (err) {
    console.error(err);
    toast("Couldn't load the city model.");
  }
  setLoad(1);
  requestAnimationFrame(frame);
  setTimeout(() => $("loading").classList.add("gone"), 300);
})();
</script>
